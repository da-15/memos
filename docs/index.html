<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>もちメモ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#EDF8F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E2A25" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="もちメモ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: one column of soft pastel "mochi" cards on a polka-dot ground; floating round + button; editor slides over as a sheet of lined paper. */
:root {
  --bg: #EDF8F1;
  --dot: rgba(80, 170, 120, .14);
  --ink: #5A3D4B;
  --ink-soft: #A08390;
  --accent: #FF6F9C;
  --accent-2: #FF9DBB;
  --accent-ink: #FFFFFF;
  --surface: rgba(255, 255, 255, .78);
  --shadow: rgba(90, 150, 115, .24);
  --danger: #FF7A8A;
  --danger-ink: #FFFFFF;
  --line: rgba(200, 90, 130, .16);
  --mochi: #FFFFFF;
  --mochi-line: #F4B7C9;
  --blush: #FFB3C7;
  --c0: #FFE3EA; /* いちご */
  --c1: #FFF1C9; /* レモン */
  --c2: #C8EEDB; /* ミント */
  --rim: #FFFFFF;
  --pal-y: #F2BE3C;
  --pal-g: #4FBF8C;
  --pal-b: #5EA2E6;
  --c3: #E7E4FF; /* ラベンダー */
  --c4: #DCEFFF; /* ソーダ */
  --c5: #FFE6D3; /* ピーチ */
  --font: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1E2A25; --dot: rgba(140, 220, 175, .08); --ink: #F7E8EF; --ink-soft: #B59DAA;
    --accent: #FF8DB1; --accent-2: #FFB0C8; --accent-ink: #3A1F2C; --surface: rgba(44, 64, 56, .85);
    --shadow: rgba(0, 0, 0, .35); --danger: #E8697A; --danger-ink: #FFFFFF; --line: rgba(255, 170, 200, .13);
    --mochi: #FFF6F9; --mochi-line: #F4B7C9; --blush: #FF9DBB;
    --c0: #4B3140; --c1: #4A4230; --c2: #2F5444; --rim: rgba(255, 255, 255, .10); --c3: #3C3A5E; --c4: #2E4257; --c5: #4D3A31;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1E2A25; --dot: rgba(140, 220, 175, .08); --ink: #F7E8EF; --ink-soft: #B59DAA;
  --accent: #FF8DB1; --accent-2: #FFB0C8; --accent-ink: #3A1F2C; --surface: rgba(44, 64, 56, .85);
  --shadow: rgba(0, 0, 0, .35); --danger: #E8697A; --danger-ink: #FFFFFF; --line: rgba(255, 170, 200, .13);
  --mochi: #FFF6F9; --mochi-line: #F4B7C9; --blush: #FF9DBB;
  --c0: #4B3140; --c1: #4A4230; --c2: #2F5444; --rim: rgba(255, 255, 255, .10); --c3: #3C3A5E; --c4: #2E4257; --c5: #4D3A31;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
/* ページ自体は動かさず、一覧だけを専用の枠の中でスクロールさせる
   （iOSがキーボードの開け閉めでページをずらしても、一覧がバーの裏に入りこまないように） */
body {
  position: fixed; inset: 0; overflow: hidden;
  display: flex; flex-direction: column;
  font-family: var(--font);
  color: var(--ink);
  background-color: var(--bg);
  background-image: radial-gradient(var(--dot) 2.2px, transparent 2.6px);
  background-size: 22px 22px;
  overscroll-behavior-y: none;
  touch-action: manipulation;
  -webkit-text-size-adjust: 100%;
}
body.editing { overflow: hidden; }
/* 入力中も裏の一覧は隠さない（入力画面がキーボードの裏まで全面をおおうので見えない）。
   隠す→表示の切り替えをキーボードが閉じる最中にすると、iOSが一番上のタイトルを描き忘れるため */
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 2px; }

/* ===== Top ===== */
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
.top {
  flex: none; position: relative; z-index: 5;
  display: flex; align-items: center; gap: 10px;
  padding-block: 14px 10px;
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
}
.top h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: .04em; }
.count {
  margin-left: 2px; padding: 2px 10px; border-radius: 999px;
  background: var(--surface); color: var(--ink-soft); font-size: 13px; font-weight: 700;
  font-variant-numeric: tabular-nums; box-shadow: 0 2px 0 var(--shadow);
}
.mochi { width: 40px; height: 33px; flex: none; animation: bob 3.2s ease-in-out infinite; transform-origin: 50% 90%; }
@keyframes bob { 0%,100% { transform: scale(1, 1); } 50% { transform: scale(1.06, .94); } }

.hint {
  flex: none; margin: 0; padding-block: 0 8px; font-size: 12px; color: var(--ink-soft);
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}

.scroller {
  flex: 1; min-height: 0; overflow-y: auto;
  -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
}
main {
  padding-block: 6px calc(120px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 640px; margin: 0 auto;
}
#list {
  list-style: none; margin: 0; padding: 0;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
.item {
  position: relative; margin-bottom: 12px; border-radius: 22px;
  transition: transform .22s cubic-bezier(.2, .8, .3, 1), height .3s ease, margin .3s ease, opacity .3s ease;
}
.del-bg {
  position: absolute; inset: 0; border-radius: 22px;
  display: flex; align-items: center; justify-content: flex-end; gap: 6px;
  padding-right: 22px; background: var(--danger); color: var(--danger-ink);
  font-weight: 700; font-size: 14px; opacity: 0; transition: opacity .15s;
}
.del-bg svg { width: 22px; height: 22px; transition: transform .2s cubic-bezier(.3, 1.6, .5, 1); }
.item.swiping .del-bg, .item.removing .del-bg { opacity: 1; }
.item.armed .del-bg svg { transform: scale(1.3) rotate(-10deg); }
.card {
  position: relative; padding: 14px 18px 12px; border-radius: 22px;
  background: var(--card, var(--c0));
  box-shadow: 0 3px 0 var(--shadow), 0 10px 22px -12px var(--shadow);
  transition: transform .3s cubic-bezier(.2, .9, .3, 1.2), box-shadow .2s;
  cursor: pointer;
}
.item.swiping .card { transition: none; }
.item.pressing .card { transform: scale(.98); }
.card .title { font-size: 17px; font-weight: 700; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .body {
  margin-top: 3px; font-size: 14px; line-height: 1.55; color: var(--ink-soft);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  white-space: pre-line; word-break: break-word;
}
.card .body:empty { display: none; }
.card .date { margin-top: 6px; font-size: 11.5px; color: var(--ink-soft); text-align: right; font-variant-numeric: tabular-nums; }
.title.untitled { color: var(--ink-soft); }

#list.dragging .item:not(.lifted) { opacity: .92; }
.item.lifted { z-index: 3; transition: none; }
.item.lifted .card { box-shadow: 0 6px 0 var(--shadow), 0 22px 36px -14px var(--shadow); }
.item.settling { transition: transform .22s cubic-bezier(.2, .8, .3, 1); }
.item.removing { pointer-events: none; }
.item.pop .card { animation: pop .5s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { 0% { transform: scale(.85); } 100% { transform: scale(1); } }

.empty { text-align: center; padding: 64px 12px; color: var(--ink-soft); }
.empty .mochi { width: 120px; height: 98px; }
.empty p { margin: 14px 0 0; font-size: 15px; line-height: 1.7; }
.empty strong { color: var(--ink); font-size: 18px; }

/* ===== + button ===== */
.fab {
  position: fixed; z-index: 6;
  right: calc(22px + env(safe-area-inset-right, 0px));
  bottom: calc(26px + env(safe-area-inset-bottom, 0px));
  width: 66px; height: 66px; border: 0; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, var(--accent-2), var(--accent) 70%);
  box-shadow: 0 5px 0 color-mix(in srgb, var(--accent) 60%, #8a2c4c), 0 14px 26px -8px var(--shadow);
  cursor: pointer; transition: transform .25s cubic-bezier(.3, 1.6, .5, 1);
}
.fab::before, .fab::after {
  content: ""; position: absolute; left: 50%; top: 50%;
  width: 26px; height: 6px; border-radius: 6px; background: var(--accent-ink);
  transform: translate(-50%, -50%);
}
.fab::after { transform: translate(-50%, -50%) rotate(90deg); }
.fab:active { transform: scale(.88) translateY(3px); }
body.editing .fab { transform: scale(0); }

/* ===== Toast ===== */
.toast {
  position: fixed; z-index: 30;
  left: calc(16px + env(safe-area-inset-left, 0px));
  right: calc(104px + env(safe-area-inset-right, 0px));
  bottom: calc(34px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 10px; justify-content: space-between;
  padding: 10px 10px 10px 16px; border-radius: 18px;
  background: var(--ink); color: var(--bg); font-size: 14px;
  box-shadow: 0 10px 24px -10px var(--shadow);
  transform: translateY(140%); opacity: 0; transition: transform .3s cubic-bezier(.3, 1.4, .5, 1), opacity .2s;
}
.toast.show { transform: none; opacity: 1; }
.toast.warn { background: var(--danger); color: var(--danger-ink); font-weight: 700; line-height: 1.5; }
body.editing .toast { right: calc(16px + env(safe-area-inset-right, 0px)); }
.toast button {
  border: 0; border-radius: 12px; padding: 6px 12px; cursor: pointer;
  background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 13px;
}

/* ===== Editor ===== */
.editor {
  position: fixed; left: 0; top: 0; width: 100%; height: 100%; z-index: 20;
  display: flex; flex-direction: column;
  background: var(--paper, var(--c0));
  /* 閉じているときは画面の右外に置くだけ（隠す→表示の切り替えをすると、iOSが文字を描き忘れたり
     キーボードを出さなかったりするため）。操作できないようにするのは inert で行う */
  transform: translateX(calc(100% + 48px)); /* 左の影も見えないところまで */
  transition: transform .34s cubic-bezier(.2, .8, .25, 1), background-color .3s;
  box-shadow: -10px 0 30px -12px var(--shadow);
}
.editor.open { transform: none; }
.editor.dragging { transition: none; }
/* 新しいメモはその場でぱっと開く。最初から定位置・不透明なので、すぐキーボードを出せる */
.editor.open.from-fab { transition: none; }
/* iOSは透明・画面外の入力欄にはキーボードを出さないので、入力欄そのものは動かさず上のバーだけはずませる */
.editor.open.from-fab .ed-bar { animation: barpop .42s cubic-bezier(.3, 1.5, .5, 1); }
@keyframes barpop { from { transform: translateY(-8px) scale(.96); } to { transform: none; } }
.ed-bar {
  display: flex; align-items: center; gap: 8px;
  padding-block: calc(10px + env(safe-area-inset-top, 0px)) 8px;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.back {
  display: inline-flex; align-items: center; gap: 2px;
  border: 0; border-radius: 999px; padding: 8px 16px 8px 10px; cursor: pointer;
  background: var(--surface); font-size: 15px; font-weight: 700;
  box-shadow: 0 2px 0 var(--shadow);
}
.back svg { width: 20px; height: 20px; }
.back:active { transform: scale(.94); }
.ed-date { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
/* 保存の印：ふだんは小さな丸い印だけ（言葉は読み上げ用に残し、画面には出さない）。保存できないときだけ文字で出す */
.saved {
  flex: none; display: grid; place-items: center;
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--surface); font-size: 0; color: transparent;
}
.saved::before { content: ""; }
.saved.empty::before { width: 8px; height: 8px; border-radius: 50%; border: 2px solid var(--line); }
.saved.saving::before { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: savepulse 1s ease-in-out infinite; }
.saved.ok::before { width: 13px; height: 7px; border: solid var(--accent); border-width: 0 0 3px 3px; border-radius: 1px; transform: translateY(-2px) rotate(-45deg); }
@keyframes savepulse { 50% { transform: scale(.55); opacity: .5; } }
/* 文字の大きさボタンとスライドバー */
.size-btn {
  flex: none; width: 38px; height: 38px; padding: 0; border: 0; border-radius: 50%; cursor: pointer;
  display: grid; place-items: center;
  background: var(--surface); color: var(--ink); font-size: 18px; font-weight: 700; line-height: 1;
  box-shadow: 0 2px 0 var(--shadow);
  transition: transform .25s cubic-bezier(.3, 1.6, .5, 1), background-color .2s;
}
.size-btn[aria-expanded="true"] { background: var(--accent); color: var(--accent-ink); }
.size-btn:active { transform: scale(.9); }
.size-panel {
  display: flex; align-items: center; gap: 12px;
  margin-block: 2px 12px;
  margin-left: max(16px, env(safe-area-inset-left, 0px));
  margin-right: max(16px, env(safe-area-inset-right, 0px));
  padding: 8px 16px; border-radius: 999px;
  background: var(--surface); box-shadow: 0 2px 0 var(--shadow);
  animation: drop .28s cubic-bezier(.3, 1.4, .5, 1);
}
.sp-a { font-weight: 700; color: var(--ink-soft); line-height: 1; }
.sp-small { font-size: 13px; }
.sp-big { font-size: 24px; }
.sp-val { min-width: 2ch; font-size: 13px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; text-align: right; }
#size-range { -webkit-appearance: none; appearance: none; flex: 1; min-width: 0; height: 32px; margin: 0; background: transparent; }
#size-range::-webkit-slider-runnable-track {
  height: 8px; border-radius: 8px;
  background: linear-gradient(to right, var(--accent) 0 var(--fill, 10%), var(--line) var(--fill, 10%) 100%);
}
#size-range::-webkit-slider-thumb {
  -webkit-appearance: none; width: 28px; height: 28px; margin-top: -10px; border-radius: 50%;
  background: #FFFFFF; border: 3px solid var(--accent); box-shadow: 0 2px 0 var(--shadow);
}
#size-range::-moz-range-track { height: 8px; border-radius: 8px; background: var(--line); }
#size-range::-moz-range-progress { height: 8px; border-radius: 8px; background: var(--accent); }
#size-range::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF; border: 3px solid var(--accent); }
.color-btn {
  flex: none; width: 38px; height: 38px; padding: 0; border: 0; border-radius: 50%; cursor: pointer;
  display: grid; place-items: center;
  background: var(--surface); color: var(--ink);
  box-shadow: 0 2px 0 var(--shadow);
  transition: transform .25s cubic-bezier(.3, 1.6, .5, 1);
}
.color-btn svg { width: 24px; height: 24px; }
.color-btn[aria-expanded="true"] { transform: rotate(-14deg) scale(1.08); }
.color-btn:active { transform: scale(.9); }
.palette {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
  padding-block: 2px 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  animation: drop .28s cubic-bezier(.3, 1.4, .5, 1);
}
@keyframes drop { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
.swatch {
  position: relative; width: 38px; height: 38px; padding: 0; border-radius: 50%; cursor: pointer;
  border: 3px solid var(--surface); background: var(--sw);
  box-shadow: 0 2px 0 var(--shadow);
  transition: transform .2s cubic-bezier(.3, 1.6, .5, 1);
}
.swatch:active { transform: scale(.88); }
.swatch[aria-checked="true"] { border-color: var(--accent); transform: scale(1.1); }
.swatch[aria-checked="true"]::after {
  content: ""; position: absolute; left: 50%; top: 45%; width: 7px; height: 13px;
  border: solid var(--accent); border-width: 0 3px 3px 0; border-radius: 1px;
  transform: translate(-50%, -50%) rotate(45deg);
}
.saved.err {
  width: auto; height: auto; padding: 5px 10px; border-radius: 999px; cursor: pointer;
  font-size: 12px; font-weight: 700; color: var(--danger-ink); background: var(--danger);
}
.saved.err::before { display: none; }
#text {
  --lh: 32px;
  flex: 1; width: 100%; border: 0; outline: none; resize: none;
  padding-block: 6px 40px;
  padding-left: max(22px, env(safe-area-inset-left, 0px));
  padding-right: max(22px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
  font-family: var(--font); font-size: 17px; font-weight: 500; line-height: var(--lh); color: var(--ink);
  background-color: transparent;
  background-image: linear-gradient(transparent calc(var(--lh) - 1.5px), var(--line) calc(var(--lh) - 1.5px));
  background-size: 100% var(--lh); background-position: 0 6px; background-attachment: local;
  -webkit-user-select: text; user-select: text;
}
#text::placeholder { color: var(--ink-soft); opacity: .8; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>

<header class="top">
  <svg class="mochi" viewBox="0 0 64 52" aria-hidden="true">
    <path d="M5 37C5 22 17 8 32 8s27 14 27 29c0 7-7 10-27 10S5 44 5 37z" fill="var(--mochi)" stroke="var(--mochi-line)" stroke-width="2.5"/>
    <circle cx="23" cy="30" r="2.7" fill="#5A3D4B"/><circle cx="41" cy="30" r="2.7" fill="#5A3D4B"/>
    <ellipse cx="16.5" cy="36" rx="4.2" ry="2.5" fill="var(--blush)"/><ellipse cx="47.5" cy="36" rx="4.2" ry="2.5" fill="var(--blush)"/>
    <path d="M29 35q3 3.2 6 0" stroke="#5A3D4B" stroke-width="2" fill="none" stroke-linecap="round"/>
  </svg>
  <h1>もちメモ</h1>
  <span class="count" id="count">0こ</span>
</header>
<p class="hint" id="hint">タップでひらく・長押しで並べかえ・左にスワイプで削除</p>

<div class="scroller" id="scroller">
<main>
  <ul id="list"></ul>
  <div class="empty" id="empty" hidden>
    <svg class="mochi" viewBox="0 0 64 52" aria-hidden="true">
      <path d="M5 37C5 22 17 8 32 8s27 14 27 29c0 7-7 10-27 10S5 44 5 37z" fill="var(--mochi)" stroke="var(--mochi-line)" stroke-width="2"/>
      <circle cx="23" cy="30" r="2.4" fill="#5A3D4B"/><circle cx="41" cy="30" r="2.4" fill="#5A3D4B"/>
      <ellipse cx="16.5" cy="36" rx="4" ry="2.4" fill="var(--blush)"/><ellipse cx="47.5" cy="36" rx="4" ry="2.4" fill="var(--blush)"/>
      <path d="M29 35q3 3.2 6 0" stroke="#5A3D4B" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    </svg>
    <p><strong>まだメモがないよ</strong><br>右下の ＋ から書いてみてね</p>
  </div>
</main>
</div>

<button class="fab" id="fab" type="button" aria-label="新しいメモを書く"></button>

<div class="toast" id="toast" role="status" aria-live="polite">
  <span id="toast-msg"></span>
  <button type="button" id="toast-undo">もどす</button>
</div>

<section class="editor" id="editor" aria-hidden="true" aria-label="メモを編集" inert>
  <div class="ed-bar">
    <button class="back" id="back" type="button" aria-label="一覧にもどる">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      もどる
    </button>
    <span class="ed-date" id="ed-date"></span>
    <button class="size-btn" id="size-btn" type="button" aria-label="文字の大きさ" aria-expanded="false" aria-controls="size-panel"><span aria-hidden="true">あ</span></button>
    <button class="color-btn" id="color-btn" type="button" aria-label="メモの色をえらぶ" aria-expanded="false" aria-controls="palette">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3a9 9 0 0 0 0 18c1.1 0 1.8-.8 1.8-1.8 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-1 .8-1.8 1.8-1.8H16a5 5 0 0 0 5-5C21 6.6 17 3 12 3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        <circle cx="7.4" cy="11.6" r="1.7" fill="var(--accent)"/>
        <circle cx="9.6" cy="7.4" r="1.7" fill="var(--pal-y)"/>
        <circle cx="14.6" cy="7.4" r="1.7" fill="var(--pal-g)"/>
        <circle cx="17.2" cy="11.2" r="1.7" fill="var(--pal-b)"/>
      </svg>
    </button>
    <span class="saved ok" id="saved" role="status">ほぞんずみ</span>
  </div>
  <div class="size-panel" id="size-panel" hidden>
    <span class="sp-a sp-small" aria-hidden="true">あ</span>
    <input type="range" id="size-range" min="16" max="26" step="1" value="17" aria-label="文字の大きさ">
    <span class="sp-a sp-big" aria-hidden="true">あ</span>
    <span class="sp-val" id="sp-val" aria-hidden="true">17</span>
  </div>
  <div class="palette" id="palette" role="radiogroup" aria-label="メモの色" hidden></div>
  <textarea id="text" placeholder="なにをメモする？" aria-label="メモの本文"></textarea>
</section>

<script>
(() => {
  'use strict';
  const KEY = 'mochimemo.v1';
  const COLORS = 6;
  const GAP = 12;
  const $ = (id) => document.getElementById(id);
  const scroller = $('scroller');
  const list = $('list'), empty = $('empty'), count = $('count');
  const editor = $('editor'), text = $('text'), saved = $('saved'), edDate = $('ed-date');
  const toast = $('toast'), toastMsg = $('toast-msg'), toastUndo = $('toast-undo');

  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  /* ---------- データ ---------- */
  function seed() {
    const now = Date.now();
    return [
      { id: uid(), color: 0, created: now, updated: now, text: 'ようこそ もちメモへ！\n右下の ＋ で新しいメモが書けます。書いた内容は自動で保存されるよ。' },
      { id: uid(), color: 3, created: now, updated: now - 6e4, text: '左にスワイプで削除\nまちがえて消しても、下に出る「もどす」で元通り。' },
      { id: uid(), color: 2, created: now, updated: now - 12e4, text: '長押しで並べかえ\nぷにっと持ち上がったら、そのまま上下にドラッグしてね。' },
      { id: uid(), color: 1, created: now, updated: now - 864e5, text: 'お買いもの\n・牛乳\n・いちごジャム\n・食パン' },
    ];
  }
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      // 前のバージョンで残ってしまった空のメモはここで片づける
      if (raw) return JSON.parse(raw).filter((m) => m.text.trim() !== '');
    } catch (e) {}
    return seed();
  }
  // 保存に失敗したら（容量オーバーなど）警告を出す。直ったらお知らせする
  let saveFailed = false;
  function persist() {
    try {
      // 空のメモは保存しない（もどらずにアプリを閉じても、空のメモが残らないように）
      localStorage.setItem(KEY, JSON.stringify(memos.filter((m) => m.text.trim() !== '')));
      if (saveFailed) { saveFailed = false; showToast('保存できるようになりました', null); }
      return true;
    } catch (e) {
      if (!saveFailed) {
        saveFailed = true;
        showToast('保存できませんでした。容量がいっぱいかもしれません。いらないメモを消してみてね', null, 10000);
      }
      return false;
    }
  }
  let memos = load();

  /* ---------- 表示 ---------- */
  function fmt(t) {
    const d = new Date(t), n = new Date();
    const hm = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
    if (d.toDateString() === n.toDateString()) return 'きょう ' + hm;
    const y = new Date(n); y.setDate(n.getDate() - 1);
    if (d.toDateString() === y.toDateString()) return 'きのう ' + hm;
    return (d.getFullYear() !== n.getFullYear() ? d.getFullYear() + '/' : '') + (d.getMonth() + 1) + '/' + d.getDate();
  }
  function split(t) {
    const lines = t.split('\n');
    const i = lines.findIndex((l) => l.trim() !== '');
    if (i < 0) return { title: '', body: '' };
    return { title: lines[i].trim(), body: lines.slice(i + 1).filter((l) => l.trim() !== '').join('\n') };
  }
  const trashSvg = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V5a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 5v2m-8.5 0 .8 11.2A2 2 0 0 0 9.3 20h5.4a2 2 0 0 0 2-1.8L17.5 7M10 11v5m4-5v5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function itemEl(m) {
    const li = document.createElement('li');
    li.className = 'item';
    li.dataset.id = m.id;
    li.innerHTML = '<div class="del-bg">' + trashSvg + 'けす</div><div class="card"><div class="title"></div><div class="body"></div><div class="date"></div></div>';
    const card = li.querySelector('.card');
    card.style.setProperty('--card', 'var(--c' + (m.color % COLORS) + ')');
    const { title, body } = split(m.text);
    const t = card.querySelector('.title');
    t.textContent = title || 'あたらしいメモ';
    if (!title) t.classList.add('untitled');
    card.querySelector('.body').textContent = body;
    card.querySelector('.date').textContent = fmt(m.updated);
    return li;
  }
  function render(popId) {
    list.textContent = '';
    for (const m of memos) {
      const li = itemEl(m);
      if (m.id === popId) li.classList.add('pop');
      list.appendChild(li);
    }
    empty.hidden = memos.length > 0;
    $('hint').hidden = memos.length === 0;
    count.textContent = memos.length + 'こ';
  }

  /* ---------- トースト（もどす） ---------- */
  let toastTimer = null, undoFn = null;
  function showToast(msg, fn, ms) {
    toastMsg.textContent = msg;
    undoFn = fn;
    toastUndo.hidden = !fn;
    toast.classList.toggle('warn', !fn && saveFailed);
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, ms || 4500);
  }
  function hideToast() { toast.classList.remove('show'); undoFn = null; }
  toastUndo.addEventListener('click', () => { const f = undoFn; hideToast(); if (f) f(); });

  /* ---------- 削除 ---------- */
  function removeMemo(li) {
    const id = li.dataset.id;
    const idx = memos.findIndex((m) => m.id === id);
    if (idx < 0) return;
    const [m] = memos.splice(idx, 1);
    persist();
    const card = li.querySelector('.card');
    li.classList.add('removing');
    li.style.height = li.offsetHeight + 'px';
    card.style.transition = 'transform .25s ease-in';
    card.style.transform = 'translateX(-115%)';
    setTimeout(() => { li.style.height = '0px'; li.style.marginBottom = '0px'; li.style.opacity = '0'; }, 180);
    setTimeout(() => render(), 500);
    showToast('メモをけしました', () => {
      memos.splice(Math.min(idx, memos.length), 0, m);
      persist();
      render(m.id);
    });
  }

  /* ---------- ジェスチャー（タップ / スワイプ / 長押しドラッグ） ---------- */
  let g = null, lastTouch = 0;
  const pt = (e) => {
    const t = e.touches ? (e.touches[0] || e.changedTouches[0]) : e;
    return { x: t.clientX, y: t.clientY };
  };

  function gStart(e) {
    const li = e.target.closest('.item');
    if (!li || li.classList.contains('removing') || g) return;
    const p = pt(e);
    g = { li, card: li.querySelector('.card'), x0: p.x, y0: p.y, x: p.x, y: p.y, mode: 'pending' };
    li.classList.add('pressing');
    g.timer = setTimeout(beginDrag, 420);
  }
  function gMove(e) {
    if (!g) return;
    const p = pt(e);
    g.x = p.x; g.y = p.y;
    const dx = p.x - g.x0, dy = p.y - g.y0;
    if (g.mode === 'pending' && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) {
      clearTimeout(g.timer);
      g.li.classList.remove('pressing');
      if (Math.abs(dx) > Math.abs(dy) * 1.2) { g.mode = 'swipe'; g.li.classList.add('swiping'); }
      else g.mode = 'scroll';
    }
    if (g.mode === 'swipe') {
      if (e.cancelable) e.preventDefault();
      const tx = dx < 0 ? dx : dx * 0.2;
      g.card.style.transform = 'translateX(' + tx + 'px)';
      g.li.classList.toggle('armed', dx < -g.li.offsetWidth * 0.35);
    } else if (g.mode === 'drag') {
      if (e.cancelable) e.preventDefault();
      dragMove();
    }
  }
  function gEnd(cancelled) {
    if (!g) return;
    const s = g; g = null;
    clearTimeout(s.timer);
    s.li.classList.remove('pressing');
    if (s.mode === 'pending' && !cancelled) {
      openEditor(s.li.dataset.id, false);
    } else if (s.mode === 'swipe') {
      s.li.classList.remove('swiping', 'armed');
      if (!cancelled && s.x - s.x0 < -s.li.offsetWidth * 0.35) removeMemo(s.li);
      else s.card.style.transform = '';
    } else if (s.mode === 'drag') {
      dragEnd(s);
    }
  }

  function beginDrag() {
    if (!g || g.mode !== 'pending') return;
    g.mode = 'drag';
    g.li.classList.remove('pressing');
    g.items = [...list.children];
    g.i = g.items.indexOf(g.li);
    g.sy0 = scroller.scrollTop;
    g.maxScroll = scroller.scrollHeight - scroller.clientHeight; // ドラッグ中のカードで伸びた分はスクロールしない
    g.rects = g.items.map((el) => { const r = el.getBoundingClientRect(); return { top: r.top + scroller.scrollTop, h: r.height }; });
    g.step = g.rects[g.i].h + GAP;
    g.target = g.i;
    list.classList.add('dragging');
    g.li.classList.add('lifted');
    if (navigator.vibrate) { try { navigator.vibrate(12); } catch (e) {} }
    dragMove();
    const tick = () => {
      if (!g || g.mode !== 'drag') return;
      const edge = 90, sr = scroller.getBoundingClientRect();
      let v = 0;
      if (g.y < sr.top + edge) v = -Math.ceil((sr.top + edge - g.y) / 6);
      else if (g.y > sr.bottom - edge) v = Math.ceil((g.y - (sr.bottom - edge)) / 6);
      const next = Math.max(0, Math.min(g.maxScroll, scroller.scrollTop + v));
      if (v && next !== scroller.scrollTop) { scroller.scrollTop = next; dragMove(); }
      g.raf = requestAnimationFrame(tick);
    };
    g.raf = requestAnimationFrame(tick);
  }
  function dragMove() {
    const dy = g.y - g.y0 + (scroller.scrollTop - g.sy0);
    g.li.style.transform = 'translateY(' + dy + 'px) scale(1.03) rotate(-1.2deg)';
    const r = g.rects[g.i];
    const center = r.top + r.h / 2 + dy;
    let t = g.i;
    g.items.forEach((el, j) => {
      if (j === g.i) return;
      const mid = g.rects[j].top + g.rects[j].h / 2;
      let s = 0;
      if (j > g.i && center > mid) { s = -g.step; t++; }
      else if (j < g.i && center < mid) { s = g.step; t--; }
      el.style.transform = s ? 'translateY(' + s + 'px)' : '';
    });
    g.target = t;
  }
  function dragEnd(s) {
    cancelAnimationFrame(s.raf);
    const { i, target, rects, li } = s;
    let off = 0;
    if (target > i) for (let j = i + 1; j <= target; j++) off += rects[j].h + GAP;
    else for (let j = target; j < i; j++) off -= rects[j].h + GAP;
    li.classList.remove('lifted');
    li.classList.add('settling');
    li.style.transform = 'translateY(' + off + 'px)';
    setTimeout(() => {
      if (target !== i) {
        const [m] = memos.splice(i, 1);
        memos.splice(target, 0, m);
        persist();
      }
      list.classList.remove('dragging');
      render();
    }, 230);
  }

  list.addEventListener('touchstart', (e) => {
    lastTouch = Date.now();
    if (e.touches.length > 1) { gEnd(true); return; }
    gStart(e);
  }, { passive: true });
  list.addEventListener('touchmove', gMove, { passive: false });
  list.addEventListener('touchend', () => { lastTouch = Date.now(); gEnd(false); });
  list.addEventListener('touchcancel', () => gEnd(true));
  list.addEventListener('contextmenu', (e) => e.preventDefault());
  // パソコンのマウスでも試せるように
  list.addEventListener('mousedown', (e) => {
    if (e.button !== 0 || Date.now() - lastTouch < 800) return;
    gStart(e);
    const mm = (ev) => gMove(ev);
    const mu = () => { window.removeEventListener('mousemove', mm); gEnd(false); };
    window.addEventListener('mousemove', mm);
    window.addEventListener('mouseup', mu, { once: true });
  });

  /* ---------- メモの色えらび ---------- */
  const COLOR_NAMES = ['いちご', 'レモン', 'ミント', 'ラベンダー', 'ソーダ', 'ピーチ'];
  const palette = $('palette'), colorBtn = $('color-btn');
  const swatches = COLOR_NAMES.map((name, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'swatch';
    b.setAttribute('role', 'radio');
    b.setAttribute('aria-label', name);
    b.style.setProperty('--sw', 'var(--c' + i + ')');
    b.addEventListener('click', () => setColor(i));
    palette.appendChild(b);
    return b;
  });
  function markColor(c) { swatches.forEach((b, i) => b.setAttribute('aria-checked', String(i === c))); }
  function togglePalette(show) {
    if (show) toggleSize(false);
    palette.hidden = !show;
    colorBtn.setAttribute('aria-expanded', String(show));
  }
  function setColor(i) {
    if (!cur) return;
    cur.color = i;
    editor.style.setProperty('--paper', 'var(--c' + i + ')');
    markColor(i);
    saveNow();
    setTimeout(() => togglePalette(false), 220);
  }
  colorBtn.addEventListener('click', () => togglePalette(palette.hidden));
  text.addEventListener('focus', () => { togglePalette(false); toggleSize(false); });

  /* ---------- 文字の大きさ（スライドバー・書く画面だけ。アプリが覚えておく） ---------- */
  const SIZE_KEY = 'mochimemo.fontsize';
  const sizeBtn = $('size-btn'), sizePanel = $('size-panel'), sizeRange = $('size-range'), spVal = $('sp-val');
  const SIZE_MIN = 16, SIZE_MAX = 26; // 16pxより小さいと、iPhoneが入力時に画面を勝手に拡大する
  let fontSize = 17;
  try { const v = parseInt(localStorage.getItem(SIZE_KEY), 10); if (v >= SIZE_MIN && v <= SIZE_MAX) fontSize = v; } catch (e) {}
  function applySize(v) {
    fontSize = v;
    text.style.fontSize = v + 'px';
    text.style.setProperty('--lh', Math.round(v * 1.88) + 'px'); // 罫線の間隔も一緒に
    sizeRange.value = String(v);
    sizeRange.style.setProperty('--fill', ((v - SIZE_MIN) / (SIZE_MAX - SIZE_MIN) * 100) + '%');
    spVal.textContent = String(v);
  }
  function toggleSize(show) {
    if (show) togglePalette(false);
    sizePanel.hidden = !show;
    sizeBtn.setAttribute('aria-expanded', String(show));
  }
  sizeBtn.addEventListener('click', () => toggleSize(sizePanel.hidden));
  sizeRange.addEventListener('input', () => applySize(Number(sizeRange.value)));
  sizeRange.addEventListener('change', () => { try { localStorage.setItem(SIZE_KEY, String(fontSize)); } catch (e) {} });
  applySize(fontSize);

  /* ---------- メモ入力画面（自動保存） ---------- */
  let cur = null, saveTimer = null;
  // 一覧のスクロール位置。入力中にiOSが裏のページをずらすので、戻ったときに元に戻す
  let listScroll = 0, closedAt = 0;
  const restoreScroll = () => { window.scrollTo(0, 0); scroller.scrollTop = listScroll; };
  function setSaved(state) {
    // まだ何も書いていないメモは、もどると消えるので「ほぞんずみ」とは出さない
    if (state === 'ok' && cur && cur.text.trim() === '') state = 'empty';
    // 言葉は読み上げ用。画面には、保存できないとき以外は印だけが出る
    saved.textContent = state === 'ok' ? 'ほぞんずみ' : state === 'error' ? '⚠ ほぞんできてないよ' : state === 'empty' ? 'からっぽ' : 'ほぞんちゅう';
    saved.classList.toggle('ok', state === 'ok');
    saved.classList.toggle('err', state === 'error');
    saved.classList.toggle('empty', state === 'empty');
    saved.classList.toggle('saving', state === 'saving');
  }
  function saveNow() { setSaved(persist() ? 'ok' : 'error'); }
  function flush() {
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; saveNow(); }
  }
  function openEditor(id, isNew, focusNow = isNew) {
    cur = memos.find((m) => m.id === id);
    if (!cur) return;
    listScroll = isNew ? 0 : scroller.scrollTop;
    if (!saveFailed) hideToast();
    text.value = cur.text;
    editor.style.setProperty('--paper', 'var(--c' + (cur.color % COLORS) + ')');
    markColor(cur.color % COLORS);
    togglePalette(false);
    toggleSize(false);
    edDate.textContent = isNew ? 'あたらしいメモ' : fmt(cur.updated);
    setSaved(saveFailed ? 'error' : 'ok');
    editor.style.transform = '';
    editor.classList.toggle('from-fab', isNew);
    editor.classList.add('open');
    editor.setAttribute('aria-hidden', 'false');
    editor.inert = false;
    document.body.classList.add('editing');
    if (isNew && focusNow) {
      void editor.offsetHeight;
      text.focus();
    }
    else { text.scrollTop = 0; text.setSelectionRange(0, 0); }
  }
  function closeEditor() {
    if (!cur) return;
    flush();
    text.blur();
    const c = cur; cur = null;
    if (c.text.trim() === '') {
      memos = memos.filter((m) => m.id !== c.id);
      persist();
    }
    editor.style.transform = '';
    editor.classList.remove('open', 'from-fab');
    editor.setAttribute('aria-hidden', 'true');
    editor.inert = true;
    document.body.classList.remove('editing');
    render();
    // キーボードが閉じきるまでiOSがずらし続けることがあるので、何回か戻す
    closedAt = Date.now();
    // iOSは、キーボードが開いたまま戻ると一番上のメモの文字を描きなおさないことがある。
    // キーボードが閉じきったころに一覧を作りなおして、描きなおさせる
    setTimeout(freshList, 450);
    setTimeout(freshList, 1000);
    restoreScroll();
    requestAnimationFrame(restoreScroll);
    setTimeout(restoreScroll, 350);
    setTimeout(restoreScroll, 800);
  }
  text.addEventListener('input', () => {
    if (!cur) return;
    cur.text = text.value;
    cur.updated = Date.now();
    setSaved('saving');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { saveTimer = null; saveNow(); }, 500);
  });
  function freshList() {
    if (cur || g) return; // 入力中・カードを操作中は作りなおさない
    const st = scroller.scrollTop;
    render();
    scroller.scrollTop = st;
  }
  let freshTimer = null;
  // もどるボタン：左ふちスワイプと同じく、先にキーボードを閉じてから一覧へ
  $('back').addEventListener('click', () => { text.blur(); closeEditor(); });
  saved.addEventListener('click', () => { if (saveFailed) saveNow(); });
  function newMemo(focusNow) {
    const color = memos.length ? (memos[0].color + 1) % COLORS : 0;
    const now = Date.now();
    const m = { id: uid(), color, created: now, updated: now, text: '' };
    memos.unshift(m);
    openEditor(m.id, true, focusNow);
    persist();
    render();
  }
  // iPhone：指が＋にふれた瞬間（touchstart）に入力画面を開き、指をはなした瞬間（touchend）にカーソルを置く。
  // カーソルを置くときには入力画面がもう表示されているので、iOSがキーボードを出してくれる。
  // touchend のあとに来る click は打ち消す。マウスでは click で開いてすぐカーソルを置く
  const fab = $('fab');
  let fabOpened = false;
  fab.addEventListener('touchstart', () => {
    if (cur) return;
    newMemo(false);
    fabOpened = true;
  }, { passive: true });
  fab.addEventListener('touchend', (e) => {
    if (e.cancelable) e.preventDefault();
    if (fabOpened) { fabOpened = false; text.focus(); }
  });
  fab.addEventListener('touchcancel', () => { fabOpened = false; });
  fab.addEventListener('click', () => { if (!cur) newMemo(true); });
  window.addEventListener('pagehide', flush);
  document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });

  // 画面の左ふちから右へスワイプしてもどる
  let eg = null;
  editor.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    if (e.touches.length === 1 && t.clientX < 30) eg = { x0: t.clientX, y0: t.clientY, on: false };
  }, { passive: true });
  editor.addEventListener('touchmove', (e) => {
    if (!eg) return;
    const t = e.touches[0];
    const dx = t.clientX - eg.x0, dy = t.clientY - eg.y0;
    if (!eg.on) {
      if (dx > 10 && dx > Math.abs(dy)) { eg.on = true; editor.classList.add('dragging'); text.blur(); }
      else if (Math.abs(dy) > 10) { eg = null; return; }
    }
    if (eg.on) {
      if (e.cancelable) e.preventDefault();
      eg.dx = Math.max(0, dx);
      editor.style.transform = 'translateX(' + eg.dx + 'px)';
    }
  }, { passive: false });
  const egEnd = () => {
    if (!eg) return;
    const s = eg; eg = null;
    if (!s.on) return;
    editor.classList.remove('dragging');
    if (s.dx > window.innerWidth * 0.3) closeEditor();
    else editor.style.transform = '';
  };
  editor.addEventListener('touchend', egEnd);
  editor.addEventListener('touchcancel', egEnd);

  // キーボードが出たとき入力画面を見える範囲に合わせる
  if (window.visualViewport) {
    const vv = window.visualViewport;
    const fit = () => {
      // 一覧にもどったあと、キーボードが閉じる動きでずれたら元にもどす
      if (!cur) {
        window.scrollTo(0, 0);
        if (Date.now() - closedAt < 1500) {
          scroller.scrollTop = listScroll;
          clearTimeout(freshTimer);
          freshTimer = setTimeout(freshList, 120); // キーボードの動きが止まったら描きなおす
        }
      }
      // 入力画面の背景はキーボードの裏まで伸ばしたまま、文字を書く範囲だけキーボードの上までにする
      // （iOSのキーボード上のバーは透けるので、高さを縮めると裏の一覧が見えてしまう）
      editor.style.top = vv.offsetTop + 'px';
      editor.style.paddingBottom = Math.max(0, window.innerHeight - vv.height) + 'px';
    };
    vv.addEventListener('resize', fit);
    vv.addEventListener('scroll', fit);
  }

  render();

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
